server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 빌드 결과(assets/)는 파일 이름에 해시가 붙으므로 오래 캐시한다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html은 항상 최신본을 받아야 새 배포가 바로 반영된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: 파일이 없는 경로는 index.html로 보낸다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

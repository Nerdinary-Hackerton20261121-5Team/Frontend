# 홈서버(k3s) 자동 배포: main에 push(병합)되면 이미지를 만들어 운영자 Zot 레지스트리(registry.bemelon.me)에 올리고,
# cluster-config 레포의 이미지 태그를 갱신한다. 이후 Argo CD가 그 커밋을 감지해 클러스터에 반영한다.
# 이 주소(https://cmc-11th.bemelon.me)가 유일한 배포 주소이며 APK도 이 주소를 띄운다. Vercel은 쓰지 않는다.
#
#   main push → docker build (linux/amd64) → registry.bemelon.me/cmc-11th/frontend:<sha> push
#            → cluster-config deploy-image 호출 (app=fe) → 커밋 "deploy(fe): <image>"
#            → Argo CD 롤링 업데이트 → https://cmc-11th.bemelon.me
#
# 필요한 것: 레포 secret ZOT_USERNAME·ZOT_PASSWORD (Zot 계정 cmc-11th-ci, cmc-11th/** 에만 push 가능),
#           CLUSTER_CONFIG_DEPLOY_KEY (secrets: inherit 로 전달)
# 롤백: cluster-config 레포에서 해당 deploy(fe) 커밋을 revert
name: Deploy

# dev 서버: dev push 도 같은 흐름으로 배포하고 cluster-config 의 apps/fe-dev 를 갱신한다
#   main → app fe     → https://cmc-11th.bemelon.me      (운영)
#   dev  → app fe-dev → https://cmc-11th-dev.bemelon.me  (dev 서버, /api 는 be-dev)
# 이미지 저장소는 같고(frontend) 태그 sha 로 구분한다. concurrency 는 ref 별이라 main·dev 배포는 서로 막지 않는다.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch는 브랜치를 고를 수 있으므로, main·dev가 아닌 ref는 배포하지 않는다.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: echo "image=registry.bemelon.me/cmc-11th/frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.bemelon.me
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # 홈서버 k3s가 amd64
          push: true
          # 같은 origin(/api)으로 호출하도록 빈 값.
          build-args: |
            VITE_API_BASE_URL=
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # cluster-config 가 비공개가 되어 공개 레포에서는 그쪽의 재사용 워크플로(deploy-image.yml)를 부를 수 없다.
  # 같은 단계를 여기에 그대로 둔다. cluster-config 에는 배포 키(CLUSTER_CONFIG_DEPLOY_KEY)로 push 한다.
  deploy:
    name: deploy ${{ github.ref == 'refs/heads/dev' && 'fe-dev' || 'fe' }}
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # main → fe (운영), dev → fe-dev (dev 서버)
      APP: ${{ github.ref == 'refs/heads/dev' && 'fe-dev' || 'fe' }}
      IMAGE: ${{ needs.build.outputs.image }}
      CALLER: ${{ github.repository }}@${{ github.sha }}
      KUSTOMIZE_VERSION: v5.6.0
    steps:
      - name: Checkout cluster-config (deploy key)
        uses: actions/checkout@v4
        with:
          repository: Nerdinary-Hackerton20261121-5Team/cluster-config
          ref: main
          ssh-key: ${{ secrets.CLUSTER_CONFIG_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Install kustomize
        run: |
          if command -v kustomize >/dev/null; then kustomize version; exit 0; fi
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Set image, commit and push
        shell: bash
        run: |
          set -euo pipefail
          test -f "apps/$APP/kustomization.yaml" || { echo "::error::apps/$APP/kustomization.yaml 이 없다"; exit 1; }
          git config user.name "cluster-config-deploy[bot]"
          git config user.email "cluster-config-deploy@users.noreply.github.com"

          CHANGED=false
          bump() {
            CHANGED=false
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            (
              cd "apps/$APP"
              kustomize edit set image "$APP=$IMAGE"
              kustomize build . >/dev/null
            )
            git add "apps/$APP"
            local rc=0
            git diff --cached --quiet || rc=$?
            case "$rc" in
              0) return 0 ;;
              1) ;;
              *) echo "::error::git diff 실패($rc)"; exit "$rc" ;;
            esac
            git commit --quiet -m "deploy($APP): $IMAGE" -m "source: $CALLER"
            CHANGED=true
          }

          # 다른 배포와 겹쳐 push 가 밀리면 최신 main 을 다시 받아 한 번 더 적용한다
          for attempt in 1 2 3; do
            bump
            if [ "$CHANGED" = false ]; then
              echo "::notice::변경 없음: apps/$APP 는 이미 $IMAGE"
              exit 0
            fi
            if git push origin HEAD:main; then
              echo "### deploy($APP): $IMAGE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::push 실패($attempt/3), 최신 main 을 다시 받아 재적용"
            sleep $((attempt * 3))
          done
          echo "::error::push 3회 실패"; exit 1
